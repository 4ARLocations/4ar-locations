<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 400">

  <!-- Fond sombre -->
  <rect width="420" height="400" fill="#1A1008"/>

  <!-- Cadre illustration -->
  <rect x="30" y="28" width="360" height="210" fill="none" stroke="#C8763A" stroke-width="0.8" opacity="0.4"/>

  <g fill="none" stroke="#C8763A" stroke-linecap="round" stroke-linejoin="round">

    <!-- ════════════════════════════════════
         GAUCHE — CHÂTEAU DE LAURIS
         Silhouette large et lisible
    ════════════════════════════════════ -->

    <!-- Grande tour principale -->
    <rect x="48" y="90" width="36" height="120" stroke-width="2"/>
    <!-- Créneau sur la tour (bien visible) -->
    <polyline points="44,90 44,78 52,78 52,86 60,86 60,78 68,78 68,86 76,86 76,78 84,78 84,86 88,86 88,90" stroke-width="1.8"/>

    <!-- Corps du château (aile droite) -->
    <rect x="84" y="118" width="50" height="92" stroke-width="2"/>
    <!-- Toit en pente -->
    <polyline points="80,118 109,92 138,118" stroke-width="2"/>

    <!-- Grande fenêtre cintrée (tour) -->
    <path d="M57 108 Q66 98 75 108 L75 130 L57 130 Z" stroke-width="1.5"/>

    <!-- Fenêtres aile -->
    <rect x="92" y="130" width="13" height="18" rx="6" stroke-width="1.5"/>
    <rect x="113" y="130" width="13" height="18" rx="6" stroke-width="1.5"/>
    <rect x="92" y="158" width="13" height="15" stroke-width="1.4"/>
    <rect x="113" y="158" width="13" height="15" stroke-width="1.4"/>

    <!-- Porte cintrée -->
    <path d="M100 210 L100 188 Q109 178 118 188 L118 210" stroke-width="1.6"/>

    <!-- Terrasses (3 niveaux, bien lisibles) -->
    <line x1="30" y1="170" x2="48" y2="170" stroke-width="1.6"/>
    <line x1="30" y1="170" x2="30" y2="185" stroke-width="1.4"/>
    <line x1="30" y1="185" x2="48" y2="185" stroke-width="1.6"/>
    <line x1="36" y1="185" x2="36" y2="200" stroke-width="1.4"/>
    <line x1="30" y1="200" x2="48" y2="200" stroke-width="1.6"/>

    <!-- Cyprès sur terrasse (silhouette simple) -->
    <ellipse cx="40" cy="163" rx="4" ry="10" stroke-width="1.4"/>
    <line x1="40" y1="170" x2="40" y2="173" stroke-width="1.2"/>

    <!-- ════════════════════════════════════
         CENTRE — PONT SAINT-BÉNÉZET
         + PALAIS DES PAPES en fond
    ════════════════════════════════════ -->

    <!-- Palais des Papes — 2 grandes tours très lisibles -->
    <!-- Tour gauche palais -->
    <rect x="168" y="72" width="30" height="138" stroke-width="2"/>
    <polyline points="164,72 164,60 170,60 170,66 176,66 176,60 182,60 182,66 188,66 188,60 194,60 194,66 200,66 200,72" stroke-width="1.6"/>
    <!-- Fenêtre gothique tour gauche -->
    <path d="M174 90 Q183 80 192 90 L192 112 L174 112 Z" stroke-width="1.4"/>
    <path d="M174 122 Q183 112 192 122 L192 144 L174 144 Z" stroke-width="1.4"/>

    <!-- Tour droite palais -->
    <rect x="222" y="82" width="28" height="128" stroke-width="2"/>
    <polyline points="218,82 218,70 224,70 224,76 230,76 230,70 236,70 236,76 242,76 242,70 248,70 248,76 250,76 250,82" stroke-width="1.6"/>
    <!-- Fenêtre tour droite -->
    <path d="M228 100 Q236 90 244 100 L244 120 L228 120 Z" stroke-width="1.4"/>
    <path d="M228 130 Q236 120 244 130 L244 150 L228 150 Z" stroke-width="1.4"/>

    <!-- Mur de liaison entre les tours -->
    <line x1="198" y1="155" x2="222" y2="155" stroke-width="1.8"/>
    <line x1="198" y1="155" x2="198" y2="210" stroke-width="1.6"/>
    <line x1="222" y1="155" x2="222" y2="210" stroke-width="1.6"/>
    <!-- Petite fenêtre sur le mur -->
    <rect x="205" y="162" width="10" height="13" rx="4" stroke-width="1.3"/>

    <!-- Pont Saint-Bénézet — 3 grandes arches -->
    <line x1="134" y1="178" x2="270" y2="178" stroke-width="2"/>
    <!-- Grande arche 1 -->
    <path d="M138 178 Q158 148 178 178" stroke-width="2"/>
    <!-- Grande arche 2 -->
    <path d="M178 178 Q198 148 218 178" stroke-width="2"/>
    <!-- Grande arche 3 -->
    <path d="M218 178 Q238 148 258 178" stroke-width="2"/>
    <!-- Piliers du pont -->
    <line x1="178" y1="178" x2="178" y2="210" stroke-width="1.8"/>
    <line x1="218" y1="178" x2="218" y2="210" stroke-width="1.8"/>
    <line x1="258" y1="178" x2="258" y2="210" stroke-width="1.8"/>

    <!-- Chapelle sur le pont -->
    <rect x="188" y="162" width="22" height="18" stroke-width="1.6"/>
    <polyline points="185,162 199,148 213,162" stroke-width="1.6"/>
    <line x1="199" y1="148" x2="199" y2="141" stroke-width="1.4"/>
    <line x1="195" y1="144" x2="203" y2="144" stroke-width="1.4"/>

    <!-- Eau (lignes larges et claires) -->
    <path d="M134 192 Q158 186 182 192 Q206 198 230 192 Q254 186 270 192" stroke-width="1.2" opacity="0.85"/>
    <path d="M138 204 Q162 198 186 204 Q210 210 234 204 Q258 198 268 204" stroke-width="1" opacity="0.65"/>

    <!-- ════════════════════════════════════
         DROITE — ALPES / RISOUL
         3 grandes montagnes claires
    ════════════════════════════════════ -->

    <!-- Montagne gauche -->
    <polyline points="272,210 296,140 320,210" stroke-width="2"/>
    <!-- Montagne centrale (plus haute) -->
    <polyline points="290,210 318,88 346,210" stroke-width="2.2"/>
    <!-- Calotte neigeuse bien visible -->
    <polyline points="308,118 318,88 328,118" stroke-width="1.8"/>
    <!-- Montagne droite -->
    <polyline points="330,210 352,130 374,210" stroke-width="1.8"/>

    <!-- Sapins base (triangles simples) -->
    <polyline points="276,210 280,198 284,210" stroke-width="1.4"/>
    <polyline points="283,210 288,196 293,210" stroke-width="1.4"/>
    <polyline points="352,210 357,198 362,210" stroke-width="1.4"/>
    <polyline points="360,210 365,196 370,210" stroke-width="1.4"/>

    <!-- Chalet (simple et lisible) -->
    <rect x="298" y="176" width="32" height="24" stroke-width="1.6"/>
    <polyline points="294,176 314,160 334,176" stroke-width="1.6"/>
    <!-- Fenêtres chalet -->
    <rect x="302" y="182" width="8" height="7" stroke-width="1.2"/>
    <rect x="316" y="182" width="8" height="7" stroke-width="1.2"/>

    <!-- ════════════════════════════
         LIGNE DE SOL
    ════════════════════════════ -->
    <line x1="30" y1="210" x2="390" y2="210" stroke-width="1.8"/>

  </g>

  <!-- Labels des 3 lieux (en dessous de chaque section) -->
  <text x="87" y="248" text-anchor="middle"
    font-family="Georgia, serif" font-size="8" letter-spacing="2.5" font-weight="600"
    fill="#C8763A" opacity="0.75">LAURIS</text>

  <text x="210" y="248" text-anchor="middle"
    font-family="Georgia, serif" font-size="8" letter-spacing="2.5" font-weight="600"
    fill="#C8763A" opacity="0.75">AVIGNON</text>

  <text x="330" y="248" text-anchor="middle"
    font-family="Georgia, serif" font-size="8" letter-spacing="2.5" font-weight="600"
    fill="#C8763A" opacity="0.75">RISOUL 1850</text>

  <!-- Séparateurs verticaux fins -->
  <line x1="154" y1="230" x2="154" y2="252" stroke="#C8763A" stroke-width="0.6" opacity="0.35"/>
  <line x1="266" y1="230" x2="266" y2="252" stroke="#C8763A" stroke-width="0.6" opacity="0.35"/>

  <!-- TEXTE PRINCIPAL -->
  <text x="210" y="312"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="58" font-weight="700"
    fill="#C8763A" letter-spacing="-1">4AR</text>

  <line x1="100" y1="324" x2="320" y2="324" stroke="#C8763A" stroke-width="0.8" opacity="0.45"/>

  <text x="210" y="352"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="19" font-weight="400"
    letter-spacing="9"
    fill="#FAF7F2">Locations</text>

  <text x="210" y="385"
    text-anchor="middle"
    font-family="Georgia, serif"
    font-size="8.5" letter-spacing="3"
    fill="#C8763A" opacity="0.65">PROVENCE  ·  ALPES  ·  AVIGNON</text>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 160" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="420" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#F0EAE0"/>
    </linearGradient>
    <!-- Clip arrondi -->
    <clipPath id="frame">
      <rect width="420" height="160" rx="18"/>
    </clipPath>
  </defs>

  <!-- Fond -->
  <rect width="420" height="160" rx="18" fill="url(#bg)"/>

  <!-- Bordure fine dorée/terracotta -->
  <rect width="420" height="160" rx="18" fill="none" stroke="#C8763A" stroke-width="1.5" opacity="0.35"/>

  <!-- ── ICÔNE GAUCHE : 3 pictos empilés ──────────────────────── -->

  <!-- Montagne (Alpes) -->
  <g transform="translate(28, 22)">
    <!-- Neige sommet -->
    <polygon points="32,4 44,24 20,24" fill="#C8763A" opacity="0.15"/>
    <polyline points="32,4 44,24 20,24 32,4" fill="none" stroke="#C8763A" stroke-width="2" stroke-linejoin="round"/>
    <!-- Neige -->
    <polygon points="32,4 38,16 26,16" fill="white" opacity="0.9"/>
    <!-- Sapin gauche -->
    <polygon points="12,30 16,22 20,30" fill="#6B7C45" opacity="0.8"/>
    <rect x="15" y="30" width="2" height="4" fill="#6B7C45" opacity="0.6"/>
    <!-- Sapin droit -->
    <polygon points="44,30 48,22 52,30" fill="#6B7C45" opacity="0.8"/>
    <rect x="47" y="30" width="2" height="4" fill="#6B7C45" opacity="0.6"/>
    <!-- Sol -->
    <rect x="10" y="34" width="44" height="2" rx="1" fill="#C8763A" opacity="0.3"/>
  </g>

  <!-- Pont / Avignon (arche) -->
  <g transform="translate(28, 72)">
    <!-- Eau -->
    <rect x="8" y="26" width="48" height="8" rx="4" fill="#6B9EC8" opacity="0.25"/>
    <!-- Arche principale -->
    <path d="M10 28 Q32 6 54 28" fill="none" stroke="#C8763A" stroke-width="2.5"/>
    <!-- Piliers -->
    <rect x="8" y="26" width="5" height="10" rx="1" fill="#C8763A" opacity="0.7"/>
    <rect x="51" y="26" width="5" height="10" rx="1" fill="#C8763A" opacity="0.7"/>
    <!-- Créneau Palais -->
    <rect x="26" y="14" width="4" height="5" rx="0.5" fill="#C8763A" opacity="0.5"/>
    <rect x="33" y="14" width="4" height="5" rx="0.5" fill="#C8763A" opacity="0.5"/>
    <rect x="40" y="14" width="4" height="5" rx="0.5" fill="#C8763A" opacity="0.5"/>
  </g>

  <!-- Maison Luberon (façade provençale) -->
  <g transform="translate(28, 118)">
    <!-- Toiture -->
    <polygon points="4,18 32,2 60,18" fill="#C8763A" opacity="0.85"/>
    <!-- Murs -->
    <rect x="8" y="18" width="48" height="22" rx="1" fill="#E8DCC8"/>
    <!-- Porte -->
    <path d="M27 40 L27 28 Q32 23 37 28 L37 40" fill="#C8763A" opacity="0.6"/>
    <!-- Fenêtre gauche -->
    <rect x="12" y="22" width="9" height="8" rx="1" fill="#C8763A" opacity="0.3"/>
    <!-- Fenêtre droite -->
    <rect x="43" y="22" width="9" height="8" rx="1" fill="#C8763A" opacity="0.3"/>
    <!-- Volets gauche -->
    <rect x="11" y="22" width="3" height="8" rx="0.5" fill="#6B7C45" opacity="0.6"/>
    <rect x="21" y="22" width="3" height="8" rx="0.5" fill="#6B7C45" opacity="0.6"/>
    <!-- Volets droit -->
    <rect x="42" y="22" width="3" height="8" rx="0.5" fill="#6B7C45" opacity="0.6"/>
    <rect x="52" y="22" width="3" height="8" rx="0.5" fill="#6B7C45" opacity="0.6"/>
  </g>

  <!-- Ligne verticale de séparation -->
  <line x1="108" y1="20" x2="108" y2="140" stroke="#E8DCC8" stroke-width="1.5"/>

  <!-- ── TEXTE PRINCIPAL ──────────────────────────────────────── -->

  <!-- "4AR" -->
  <text x="130" y="82"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="58"
    font-weight="700"
    letter-spacing="-1"
    fill="#C8763A">4AR</text>

  <!-- "Locations" -->
  <text x="132" y="112"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="28"
    font-weight="400"
    letter-spacing="6"
    fill="#2C2416">Locations</text>

  <!-- Ligne décorative sous "Locations" -->
  <line x1="132" y1="120" x2="316" y2="120" stroke="#C8763A" stroke-width="1.2" opacity="0.5"/>

  <!-- ── SOUS-TITRE destinations ──────────────────────────────── -->
  <text x="132" y="140"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="11"
    letter-spacing="3.5"
    fill="#6B7C45"
    opacity="0.85">PROVENCE · ALPES · AVIGNON</text>

  <!-- ── DÉCORATIONS droite ───────────────────────────────────── -->

  <!-- Olive branch décoratif (coin bas-droit) -->
  <g transform="translate(355, 95)" opacity="0.18">
    <circle cx="30" cy="30" r="28" fill="#6B7C45"/>
  </g>

  <!-- Étoile / soleil stylisé -->
  <g transform="translate(370, 28)" opacity="0.6">
    <!-- Soleil Provence -->
    <circle cx="22" cy="22" r="10" fill="#C8763A" opacity="0.2"/>
    <circle cx="22" cy="22" r="6" fill="#C8763A" opacity="0.5"/>
    <!-- Rayons -->
    <line x1="22" y1="8" x2="22" y2="4" stroke="#C8763A" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="22" y1="36" x2="22" y2="40" stroke="#C8763A" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="8" y1="22" x2="4" y2="22" stroke="#C8763A" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="36" y1="22" x2="40" y2="22" stroke="#C8763A" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="12" y1="12" x2="9" y2="9" stroke="#C8763A" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="32" y1="32" x2="35" y2="35" stroke="#C8763A" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="32" y1="12" x2="35" y2="9" stroke="#C8763A" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="12" y1="32" x2="9" y2="35" stroke="#C8763A" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Flocon de neige stylisé (coin bas-droit) -->
  <g transform="translate(376, 105)" opacity="0.5">
    <line x1="12" y1="0" x2="12" y2="24" stroke="#6B9EC8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="12" x2="24" y2="12" stroke="#6B9EC8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="3" y1="3" x2="21" y2="21" stroke="#6B9EC8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="21" y1="3" x2="3" y2="21" stroke="#6B9EC8" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="12" cy="12" r="3" fill="#6B9EC8" opacity="0.4"/>
  </g>
</svg>

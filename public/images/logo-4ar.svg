<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440">

  <!-- Fond sombre -->
  <rect width="400" height="440" fill="#1A1008"/>

  <!-- Cadre fin autour de l'illustration (comme dans la référence) -->
  <rect x="58" y="48" width="284" height="178" fill="none" stroke="#C8763A" stroke-width="0.8" opacity="0.5"/>

  <!-- ══════════════════════════════════════════════
       ILLUSTRATION LINE ART — panorama des 3 lieux
       Couleur : or/terracotta #C8763A
  ══════════════════════════════════════════════ -->
  <g fill="none" stroke="#C8763A" stroke-linecap="round" stroke-linejoin="round">

    <!-- ── CHÂTEAU DE LAURIS (gauche) ─────────────── -->

    <!-- Falaise / éperon rocheux -->
    <path d="M68 215 Q72 200 78 188 Q82 178 88 170 L95 162 L100 158" stroke-width="1.2"/>

    <!-- Corps principal château -->
    <rect x="95" y="130" width="52" height="85" stroke-width="1.3"/>

    <!-- Toit principal -->
    <polyline points="91,130 121,103 150,130" stroke-width="1.4"/>

    <!-- Tour gauche (plus haute) -->
    <rect x="84" y="118" width="16" height="44" stroke-width="1.2"/>
    <polyline points="81,118 92,104 103,118" stroke-width="1.2"/>
    <!-- Créneau tour gauche -->
    <polyline points="82,118 82,112 86,112 86,116 89,116 89,112 93,112 93,116 96,116 96,112 100,112 100,118" stroke-width="0.9"/>

    <!-- Tour droite (petite) -->
    <rect x="142" y="142" width="14" height="32" stroke-width="1.1"/>
    <polyline points="140,142 149,132 158,142" stroke-width="1.1"/>

    <!-- Fenêtres façade principale -->
    <rect x="103" y="140" width="9" height="12" rx="4" stroke-width="1"/>
    <rect x="118" y="140" width="9" height="12" rx="4" stroke-width="1"/>
    <rect x="133" y="140" width="9" height="12" rx="4" stroke-width="1"/>
    <!-- Fenêtres 2e rang -->
    <rect x="103" y="160" width="9" height="10" stroke-width="0.9"/>
    <rect x="133" y="160" width="9" height="10" stroke-width="0.9"/>
    <!-- Porte cintrée -->
    <path d="M115 215 L115 196 Q121 188 127 196 L127 215" stroke-width="1.1"/>

    <!-- Terrasses (étages descendants vers la gauche) -->
    <line x1="68" y1="185" x2="95" y2="185" stroke-width="1"/>
    <line x1="72" y1="185" x2="72" y2="195" stroke-width="0.9"/>
    <line x1="64" y1="195" x2="95" y2="195" stroke-width="1"/>
    <line x1="68" y1="195" x2="68" y2="205" stroke-width="0.9"/>
    <line x1="62" y1="205" x2="95" y2="205" stroke-width="1"/>
    <!-- Végétation terrasses (cypres) -->
    <line x1="74" y1="185" x2="74" y2="175" stroke-width="0.8"/>
    <ellipse cx="74" cy="173" rx="3" ry="6" stroke-width="0.8"/>
    <line x1="82" y1="195" x2="82" y2="184" stroke-width="0.8"/>
    <ellipse cx="82" cy="182" rx="2.5" ry="5" stroke-width="0.8"/>

    <!-- ── PONT SAINT-BÉNÉZET (centre) ────────────── -->

    <!-- Tablier du pont -->
    <line x1="147" y1="175" x2="270" y2="175" stroke-width="1.5"/>

    <!-- 4 arches -->
    <path d="M152 175 Q161 158 170 175" stroke-width="1.3"/>
    <path d="M172 175 Q181 158 190 175" stroke-width="1.3"/>
    <path d="M192 175 Q201 158 210 175" stroke-width="1.3"/>
    <path d="M212 175 Q221 158 230 175" stroke-width="1.3"/>
    <path d="M232 175 Q241 158 250 175" stroke-width="1.3"/>

    <!-- Piliers entre arches -->
    <line x1="170" y1="175" x2="170" y2="215" stroke-width="1.1"/>
    <line x1="190" y1="175" x2="190" y2="215" stroke-width="1.1"/>
    <line x1="210" y1="175" x2="210" y2="215" stroke-width="1.1"/>
    <line x1="230" y1="175" x2="230" y2="215" stroke-width="1.1"/>
    <line x1="250" y1="175" x2="250" y2="215" stroke-width="1.1"/>

    <!-- Chapelle Saint-Nicolas sur le pont -->
    <rect x="196" y="160" width="18" height="16" stroke-width="1"/>
    <polyline points="193,160 205,149 217,160" stroke-width="1"/>
    <!-- Petite croix sur la chapelle -->
    <line x1="205" y1="149" x2="205" y2="143" stroke-width="0.9"/>
    <line x1="202" y1="146" x2="208" y2="146" stroke-width="0.9"/>
    <!-- Fenêtre chapelle -->
    <path d="M200 164 Q205 160 210 164 L210 176 L200 176 Z" stroke-width="0.8"/>

    <!-- Eau du Rhône (lignes ondulées) -->
    <path d="M152 190 Q165 186 178 190 Q191 194 204 190 Q217 186 230 190 Q243 194 256 190" stroke-width="0.8" opacity="0.8"/>
    <path d="M158 200 Q172 196 186 200 Q200 204 214 200 Q228 196 242 200 Q256 204 265 200" stroke-width="0.7" opacity="0.6"/>
    <path d="M152 210 Q168 207 184 210 Q200 213 216 210 Q232 207 248 210" stroke-width="0.6" opacity="0.5"/>

    <!-- ── PALAIS DES PAPES + AVIGNON (fond droit du pont) ── -->

    <!-- Grande tour palais -->
    <rect x="252" y="128" width="22" height="88" stroke-width="1.3"/>
    <!-- Créneau grande tour -->
    <polyline points="250,128 250,120 254,120 254,124 258,124 258,120 262,120 262,124 266,124 266,120 270,120 270,124 274,124 274,128" stroke-width="0.9"/>
    <!-- Fenêtres palais -->
    <path d="M256 142 Q261 136 266 142 L266 155 L256 155 Z" stroke-width="0.9"/>
    <path d="M256 163 Q261 157 266 163 L266 175 L256 175 Z" stroke-width="0.9"/>

    <!-- Tour secondaire palais -->
    <rect x="268" y="140" width="16" height="75" stroke-width="1.1"/>
    <polyline points="266,140 276,130 286,140" stroke-width="1"/>
    <rect x="271" y="152" width="7" height="10" stroke-width="0.8"/>
    <rect x="271" y="168" width="7" height="10" stroke-width="0.8"/>

    <!-- Remparts / murs de liaison -->
    <line x1="147" y1="215" x2="252" y2="215" stroke-width="1"/>
    <line x1="274" y1="175" x2="332" y2="175" stroke-width="1.1"/>
    <line x1="284" y1="175" x2="284" y2="215" stroke-width="1"/>

    <!-- ── ALPES / RISOUL (arrière-plan droit) ────── -->

    <!-- Montagne gauche -->
    <polyline points="278,215 296,145 314,215" stroke-width="1.3"/>
    <!-- Montagne centrale (la plus haute) -->
    <polyline points="296,215 316,105 336,215" stroke-width="1.5"/>
    <!-- Calotte neigeuse -->
    <polyline points="310,130 316,105 322,130" stroke-width="1" opacity="0.9"/>
    <!-- Montagne droite -->
    <polyline points="318,215 332,140 346,215" stroke-width="1.2"/>

    <!-- Sapins base montagnes -->
    <polyline points="286,215 289,205 292,215" stroke-width="0.9"/>
    <polyline points="291,215 295,203 299,215" stroke-width="0.9"/>
    <polyline points="336,215 339,207 342,215" stroke-width="0.9"/>
    <polyline points="340,215 344,204 348,215" stroke-width="0.9"/>

    <!-- Remontées mécaniques (câble fin) -->
    <line x1="296" y1="145" x2="332" y2="140" stroke-width="0.7" stroke-dasharray="3,2" opacity="0.5"/>
    <circle cx="310" cy="143" r="2" stroke-width="0.9" opacity="0.6"/>
    <circle cx="322" cy="141" r="2" stroke-width="0.9" opacity="0.6"/>

    <!-- ── LIGNE DE SOL ────────────────────────────── -->
    <line x1="68" y1="215" x2="348" y2="215" stroke-width="1.3"/>

  </g>

  <!-- ══════════════════════════════════════════════
       TEXTE
  ══════════════════════════════════════════════ -->

  <!-- "4AR" — grand, serif -->
  <text
    x="200" y="288"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="52" font-weight="700"
    fill="#C8763A"
    letter-spacing="-1">4AR</text>

  <!-- Ligne fine de séparation -->
  <line x1="120" y1="300" x2="280" y2="300" stroke="#C8763A" stroke-width="0.8" opacity="0.5"/>

  <!-- "Locations" -->
  <text
    x="200" y="328"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="18" font-weight="400"
    letter-spacing="8"
    fill="#FAF7F2">Locations</text>

  <!-- Sous-titre destinations -->
  <text
    x="200" y="368"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="9" font-weight="400"
    letter-spacing="3"
    fill="#C8763A" opacity="0.7">PROVENCE  ·  ALPES  ·  AVIGNON</text>

  <!-- Points décoratifs flanquant le sous-titre -->
  <circle cx="80" cy="364" r="1.5" fill="#C8763A" opacity="0.4"/>
  <circle cx="320" cy="364" r="1.5" fill="#C8763A" opacity="0.4"/>

</svg>

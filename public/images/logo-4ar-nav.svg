<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 52" fill="none">
  <defs>
    <linearGradient id="g-gold-n" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4A843"/>
      <stop offset="100%" stop-color="#C8763A"/>
    </linearGradient>
  </defs>

  <!-- ── Mini trilobed badge ── -->

  <!-- Circle Alps (top) -->
  <circle cx="26" cy="16" r="13" fill="#D8EDF8"/>
  <!-- Mountain -->
  <polygon points="26,6 33,18 19,18" fill="#7A9DB5"/>
  <polygon points="26,6 23,11 29,11" fill="white" opacity="0.95"/>
  <!-- Pine left -->
  <polygon points="17,18 19.5,13 22,18" fill="#3A6B3A"/>
  <!-- Pine right -->
  <polygon points="30,18 32.5,13 35,18" fill="#3A6B3A"/>

  <!-- Circle Lauris (bottom-left) -->
  <circle cx="17" cy="37" r="13" fill="#F0E4C0"/>
  <!-- Château silhouette -->
  <rect x="9" y="32" width="16" height="11" fill="#D4B896"/>
  <polygon points="7,32 17,26 27,32" fill="#C8763A" opacity="0.9"/>
  <!-- Cypress -->
  <ellipse cx="27" cy="34" rx="2.5" ry="7" fill="#3A6B3A"/>

  <!-- Circle Avignon (bottom-right) -->
  <circle cx="35" cy="37" r="13" fill="#C8E0EE"/>
  <!-- Bridge arch -->
  <path d="M24 40 Q29 33 34 40" fill="none" stroke="#C8A882" stroke-width="2"/>
  <path d="M34 40 Q39 33 44 40" fill="none" stroke="#C8A882" stroke-width="2"/>
  <rect x="23" y="39" width="23" height="3" rx="0.5" fill="#C8A882"/>
  <!-- Water -->
  <rect x="23" y="42" width="23" height="5" rx="2" fill="#6BB8D8" opacity="0.5"/>

  <!-- Borders on circles -->
  <circle cx="26" cy="16" r="13" fill="none" stroke="url(#g-gold-n)" stroke-width="1.2"/>
  <circle cx="17" cy="37" r="13" fill="none" stroke="url(#g-gold-n)" stroke-width="1.2"/>
  <circle cx="35" cy="37" r="13" fill="none" stroke="url(#g-gold-n)" stroke-width="1.2"/>

  <!-- ── Text ── -->
  <!-- 4AR -->
  <text x="62" y="24"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="22" font-weight="700"
    fill="#C8763A">4AR</text>

  <!-- Locations -->
  <text x="63" y="40"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="13" font-weight="400"
    letter-spacing="3"
    fill="#2C2416">Locations</text>

  <!-- Fine ligne séparatrice verticale -->
  <line x1="56" y1="8" x2="56" y2="46" stroke="#E8DCC8" stroke-width="1"/>

  <!-- Sous-texte destinations -->
  <text x="108" y="45"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="7" letter-spacing="1.5"
    fill="#6B7C45" opacity="0.8">PROVENCE · ALPES · AVIGNON</text>
</svg>
